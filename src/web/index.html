<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ÖPPNA · Offentlig service. Enklare.</title>
    <meta name="description" content="Beskriv ditt ärende med egna ord." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body data-save-state="loading">
    <header class="site-header">
      <a class="brand" href="/" aria-label="ÖPPNA startsida"
        ><span class="brand-icon">ö</span> ÖPPNA</a
      ><span class="tagline">Offentlig service. Enklare.</span>
    </header>
    <div id="error-banner" role="alert" hidden></div>
    <section id="identity-panel" class="panel staff-shell" hidden></section>
    <main class="workspace" id="citizen-workspace">
      <div class="citizen-column">
        <section class="panel intent-panel">
          <h1>Vad vill du göra?</h1>
          <p class="intro">
            Börja med din idé. Vi hjälper dig reda ut nästa steg.
          </p>
          <label class="sr-only" for="intent">Beskriv ditt mål</label>
          <div class="input-wrap">
            <textarea
              id="intent"
              maxlength="3000"
              disabled
              placeholder="Beskriv vad du vill göra och var…"
              spellcheck="true"
            ></textarea>
            <div class="input-meta"><span id="count">0 / 3 000</span></div>
          </div>
          <div id="question" hidden></div>
          <section id="facts">
            <div class="facts-heading"><h2>Det här har vi förstått</h2></div>
            <p class="empty-state">Inga uppgifter ännu.</p>
          </section>
        </section>
      </div>
      <div class="system-column">
        <section class="terminal" aria-label="Systemdata">
          <div class="terminal-bar">
            <span id="case-ref">case / …</span>
            <div role="tablist" aria-label="Systemets vy">
              <button
                id="json-tab"
                role="tab"
                aria-selected="true"
                aria-controls="system-content"
                data-system-tab="json"
              >
                Ärendegraf</button
              ><button
                id="events-tab"
                role="tab"
                aria-selected="false"
                aria-controls="system-content"
                data-system-tab="events"
                tabindex="-1"
              >
                Händelser
              </button>
            </div>
            <span class="live"><i></i> Live</span>
          </div>
          <div
            id="system-content"
            role="tabpanel"
            aria-labelledby="json-tab"
          ></div>
        </section>
        <section class="panel authority-panel">
          <h2>Handläggare</h2>
          <div id="authority">
            <p class="empty-state">Inga uppgifter ännu.</p>
          </div>
        </section>
      </div>
    </main>
    <main id="staff-workspace" hidden>
      <section class="panel staff-shell">
        <h1>Handläggare</h1>
        <div id="staff-standalone"></div>
      </section>
    </main>
  </body>
</html>
